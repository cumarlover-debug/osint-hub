name: Report a problem with a listing
description: A tool is broken, moved, mislabelled, or should not be listed.
title: "Problem: "
labels: [listing-problem]
body:
  - type: input
    id: tool
    attributes:
      label: Tool
      description: The tool's page address on osint-hub, or its name.
      placeholder: https://osinthub.pages.dev/tools/sherlock
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong
      options:
        - The link is broken or the tool has shut down
        - The tool moved to a new address
        - The description or details are wrong
        - The search link on the page does not work
        - It should not be listed (policy)
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What did you see, and what should it say instead? Include the new address if it moved.
    validations:
      required: true
