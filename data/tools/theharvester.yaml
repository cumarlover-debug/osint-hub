name: theHarvester
url: https://github.com/laramies/theHarvester
description: Collects emails, names, subdomains, IPs and URLs for a domain from search engines, certificate logs and other public sources.
category: domain
inputs: [domain]
outputs: [email, domain, ip, name]
type: cli
cost: free
passive: true
account_required: false
command_template: theHarvester -d {query} -b crtsh,certspotter
repo: laramies/theHarvester
install: Preinstalled on Kali Linux. See the repo for other platforms.
language: Python
license: GPL-2.0
docker: true
platforms: [linux, macos]
tags: [recon, open-source]
notes: The DNS brute-force option queries the target's name servers, which makes it active.
