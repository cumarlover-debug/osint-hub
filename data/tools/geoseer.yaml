name: GeoSeer
url: https://www.geoseer.net/
description: 'A search engine for spatial data: it indexes open geospatial datasets and services, so you can find the dataset that covers a place rather than the page that mentions it.'
category: geolocation
inputs: [keyword, location]
type: web
cost: free
passive: true
account_required: false
notes: The hard part of geospatial work is rarely the map, it is knowing which layer exists for an area and who publishes it. This searches the metadata of those layers across providers, which is the step that otherwise means guessing at portal names.
