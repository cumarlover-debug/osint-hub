name: ChronoVerify
url: https://chronoverify.com
description: Checks when a photo was taken and whether it carries signs of editing, working on an image whether or not its metadata survived.
category: image-video
inputs: [image]
type: web
cost: freemium
passive: true
account_required: false
manual: post-form
notes: 'Photo provenance is the question a picture cannot answer about itself, so a second opinion is worth having: this reads the metadata when it is present and the pixels when it is not. It answers a form, so it stays a by-hand entry, and its pricing is not stated on the page.'
