name: 1Password Watchtower
url: https://watchtower.1password.com
description: Checks a password against known breaches here, or, inside 1Password, flags your breached, reused and weak logins.
category: email
inputs: [password]
outputs: [breach]
type: web
cost: freemium
passive: true
account_required: false
tags: [breaches, passwords]
notes: The web check is free and uses Pwned Passwords. Watchtower inside the app needs a paid 1Password account.
