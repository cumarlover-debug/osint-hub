name: Subfinder
url: https://github.com/projectdiscovery/subfinder
description: Fast, passive subdomain discovery that queries dozens of online sources and never touches the target directly.
category: domain
inputs: [domain]
outputs: [domain]
type: cli
cost: free
passive: true
account_required: false
repo: projectdiscovery/subfinder
install: go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
language: Go
license: MIT
docker: true
platforms: [linux, macos, windows]
tags: [recon, subdomains, open-source]
notes: Works without keys, but adding free API keys for its sources finds far more.
