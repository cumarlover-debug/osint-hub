name: Sylva
url: https://sylva.pfeister.dev/
description: Searches for a username, then branches out automatically as it discovers linked names, emails and accounts.
category: social-media
inputs: [username]
outputs: [social_profile, email, username]
type: cli
cost: free
passive: true
account_required: true
command_template: sylva search {query}
repo: ppfeister/sylva
language: Python
license: AGPL-3.0
platforms: [linux, macos, windows]
tags: [username-enumeration, open-source]
notes: Configure it first with `sylva config` and the API keys for the sources you intend to use; an unconfigured search fails rather than returning nothing. Because it depends on those keys it is treated as account-based, so safe mode leaves it out.
