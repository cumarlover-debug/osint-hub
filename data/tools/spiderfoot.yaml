name: SpiderFoot
url: https://github.com/smicallef/spiderfoot
description: Automates OSINT collection with 200+ modules. Give it a domain, IP, email, name or username and explore the results in a web UI.
category: frameworks
inputs: [domain, ip, email, name, username, phone]
outputs: [domain, ip, email, name, username, social_profile]
type: cli
cost: free
passive: false
account_required: false
repo: smicallef/spiderfoot
install: git clone https://github.com/smicallef/spiderfoot && pip3 install -r spiderfoot/requirements.txt
language: Python
license: MIT
docker: true
platforms: [linux, macos, windows]
tags: [automation, open-source]
notes: Some modules scan the target directly. Choose the "Passive" scan type to avoid that.
