name: GrayhatWarfare Public Buckets
url: https://buckets.grayhatwarfare.com/
description: Searches files in publicly exposed cloud storage buckets (Amazon S3, Azure, Google Cloud) by keyword or company.
category: breach
inputs: [domain, company]
outputs: [url, document]
type: web
cost: freemium
passive: true
account_required: true
manual: login
tags: [leak-data]
query_template:
  domain: https://buckets.grayhatwarfare.com/files?keywords={query}
  company: https://buckets.grayhatwarfare.com/files?keywords={query}
notes: Exposed buckets routinely hold other people's personal and commercial data. A free account covers basic search; bulk results need a paid plan.
