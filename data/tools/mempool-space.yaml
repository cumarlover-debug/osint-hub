name: mempool.space
url: https://mempool.space/
description: Open-source Bitcoin explorer for addresses, transactions and fees.
category: crypto
inputs:
  - crypto_address
type: web
cost: free
passive: true
account_required: false
query_template:
  crypto_address:
    url: https://mempool.space/address/{query}
    match: btc
tags:
  - bitcoin
  - blockchain-explorer
