name: Pwned Passwords
url: https://haveibeenpwned.com/Passwords
description: Checks whether a password has appeared in a data breach, and how often, without sending the password itself.
category: email
inputs: [password, hash]
outputs: [breach]
type: web
cost: free
passive: true
account_required: false
tags: [breaches, passwords]
notes: Part of Have I Been Pwned. Your browser sends only the first five characters of the password's SHA-1 hash, so the password never leaves your machine. The API is free and needs no key.
