name: Instaloader
url: https://github.com/instaloader/instaloader
description: Downloads Instagram profiles, posts, stories and highlights with their captions and metadata.
category: social-media
inputs:
  - username
outputs:
  - image
  - video
  - metadata
type: cli
cost: free
passive: true
account_required: true
command_template: instaloader {query}
repo: instaloader/instaloader
install: pipx install instaloader
language: Python
platforms:
  - linux
  - macos
  - windows
tags:
  - open-source
notes: Instagram answers anonymous profile queries with 429 Too Many Requests and tells the tool to retry in about eleven minutes, which it obediently does, so without a session this mostly times out rather than reporting anything. A logged-in session (--login) is what makes it work, and that uses your own account and can get it flagged. Read a 429 as blocked, never as an account that does not exist.
