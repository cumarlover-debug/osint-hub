name: Maltiverse
url: https://maltiverse.com/
description: Threat intelligence search aggregating 100+ sources, with a risk verdict for IPs, domains, URLs and file hashes.
category: threat-intel
inputs: [ip, domain, url, hash]
outputs: [reputation]
type: web
cost: freemium
passive: true
account_required: true
query_template: {ip: 'https://maltiverse.com/ip/{query}', domain: 'https://maltiverse.com/hostname/{query}', hash: 'https://maltiverse.com/sample/{query}'}
