name: FootprintIQ
url: https://footprintiq.app
description: Scans what is publicly visible about an identity across hundreds of sites and returns it as one footprint report, built as a self-audit tool rather than a lookup service.
category: people
inputs: [email, username, name]
type: web
cost: freemium
passive: true
account_required: false
manual: post-form
notes: Aimed at finding your own exposure, which makes it the rare tool in this category that is safe to point at yourself and awkward to point at anyone else. It answers a form, so run it by hand, and read what it collects before you give it an address that is not yours.
