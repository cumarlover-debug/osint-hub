name: Social Analyzer
url: https://github.com/qeeqbox/social-analyzer
description: Finds a person's profiles across 1,000+ sites by username and scores how likely each match really is them. CLI and web app.
category: social-media
inputs: [username]
outputs: [social_profile]
type: cli
cost: free
passive: true
account_required: false
command_template: social-analyzer --username {query}
repo: qeeqbox/social-analyzer
install: pip3 install --user social-analyzer
language: Python
license: AGPL-3.0
platforms: [linux, macos, windows]
tags: [username-enumeration, open-source]
notes: The package installs a command called social-analyzer; it cannot be reached as `python -m social-analyzer`, because the package directory it ships is named with a hyphen and Python's -m needs an importable name. If pipx reports no apps for it, install it with pip inside a virtualenv instead.
