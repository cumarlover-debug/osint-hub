name: Etherscan
url: https://etherscan.io
description: Ethereum blockchain explorer showing balances, transactions, token transfers and public labels for an address.
category: crypto
inputs: [crypto_address]
outputs: [crypto_address]
type: web
cost: free
passive: true
account_required: false
query_template: {crypto_address: {url: 'https://etherscan.io/address/{query}', match: eth}}
tags: [ethereum, blockchain]
