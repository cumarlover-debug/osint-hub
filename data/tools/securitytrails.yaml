name: SecurityTrails
url: https://securitytrails.com
description: Current and historical DNS records, WHOIS data and subdomains for a domain. The history shows where a site was hosted before.
category: domain
inputs: [domain, ip]
outputs: [domain, ip, dns_record]
type: web
cost: freemium
passive: true
account_required: true
query_template: {domain: 'https://securitytrails.com/domain/{query}/dns', ip: 'https://securitytrails.com/list/ip/{query}'}
tags: [dns, whois, history]
