name: Tinfoleak
url: https://tinfoleak.com/
description: 'Builds a dossier on an X / Twitter account: the services and apps it posted from, the devices and time zones behind those posts, its hashtags, mentions and the accounts it interacts with most.'
category: social-media
inputs: [username]
type: web
cost: free
passive: true
account_required: false
manual: post-form
tags: [personal-data]
notes: It answers a form rather than a URL, so it stays a by-hand entry. The whole class of tool that reads a timeline through the platform's own API has been squeezed since X closed it down, so expect partial results rather than a complete dossier; what it returns is metadata about a person's habits, which is personal data under most regimes.
