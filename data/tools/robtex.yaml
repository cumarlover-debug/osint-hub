name: Robtex
url: https://www.robtex.com
description: 'Maps how a domain or IP connects to others: shared name servers, mail servers, reverse DNS and network ranges.'
category: domain
inputs: [domain, ip]
outputs: [domain, ip, dns_record]
type: web
cost: free
passive: true
account_required: false
query_template: {domain: 'https://www.robtex.com/dns-lookup/{query}', ip: 'https://www.robtex.com/ip-lookup/{query}'}
