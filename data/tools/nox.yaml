name: NOX
url: https://github.com/nox-project/nox-framework
description: >-
  A cyber-threat-intelligence engine that pivots an identifier across more than a hundred configured sources, with
  each source defined as a JSON plugin and its API keys rotated between calls.
category: frameworks
inputs: [email, username, domain, ip]
type: cli
cost: free
passive: true
account_required: true
manual: interactive
repo: nox-project/nox-framework
install: Kali .deb from the releases, or pip install -r requirements.txt then python build_sources.py
language: Python
license: Apache-2.0
platforms: [linux]
tags: [open-source]
notes: >-
  A framework rather than a command: nox.py is the execution engine, everything it knows lives in JSON plugins under
  sources/, and the reported invocation is nox-cli -t target@company.com --autoscan, with keys in
  ~/.config/nox-cli/apikeys.json. Two things to decide before running it. It auto-fetches public proxy pools by
  default, so what carries your queries is whatever strangers are hosting unless you supply your own; and its
  pipeline includes hash cracking and scraping of paste and Telegram sources. Its capability claims are its own, not
  independently checked, and the project is new.
