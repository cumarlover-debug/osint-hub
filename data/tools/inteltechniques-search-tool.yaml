name: IntelTechniques Search Tool
url: https://inteltechniques.com/tools/
description: 'One page that routes a single input to the right query across dozens of services, grouped by what you have: a name, address, phone, email, username, domain, IP or image.'
category: search
inputs: [name, email, username, phone, domain, ip, url, image, keyword]
