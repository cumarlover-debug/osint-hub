name: Mosint
url: https://github.com/alpkeskin/mosint
description: "Automated email OSINT in one command: breaches, pastes, related domains, social accounts and public documents for an address."
category: breach
inputs: [email]
outputs: [domain, username, url]
type: cli
cost: free
passive: true
account_required: false
repo: alpkeskin/mosint
install: go install github.com/alpkeskin/mosint/v3/cmd/mosint@latest
language: Go
tags: [leak-data]
notes: >-
  Some modules need their own API keys; the free ones run without. Breached records are personal data: in most countries you need a lawful basis to search them, the vendor logs every query against
  your account, and these sets are often stale, merged between people or planted.
