name: Mosint
url: https://github.com/alpkeskin/mosint
description: "Automated email OSINT in one command: breaches, pastes, related domains, social accounts and public documents for an address."
category: breach
inputs: [email]
outputs: [domain, username, url]
type: cli
cost: free
passive: true
account_required: true
command_template: {email: 'mosint {query}'}
repo: alpkeskin/mosint
install: go install github.com/alpkeskin/mosint/v3/cmd/mosint@latest
language: Go
tags: [leak-data]
notes: >-
  It refuses to run without a config file at ~/.mosint.yaml, and that config is where the API keys live, so it is treated as account-based and safe mode leaves it out. Written in Go, so it needs a Go
  toolchain to install. Breached records are personal data: in most countries you need a lawful basis to search them, the vendor logs every query against your account, and these sets are often stale,
  merged between people or planted.
