name: DeBank
url: https://debank.com/
description: Shows an Ethereum-style address's holdings and activity across every EVM chain in one view.
category: crypto
inputs:
  - crypto_address
type: web
cost: free
passive: true
account_required: false
query_template:
  crypto_address:
    url: https://debank.com/profile/{query}
    match: eth
tags:
  - ethereum
