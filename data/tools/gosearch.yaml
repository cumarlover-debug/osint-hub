name: GoSearch
url: https://github.com/ibnaleem/gosearch
description: Checks a username across 80+ sites and against breach data and pastes in a single run.
category: breach
inputs: [username]
outputs: [social_profile, email]
type: cli
cost: free
passive: true
account_required: false
command_template: {username: 'gosearch -u {query}'}
repo: ibnaleem/gosearch
install: go install github.com/ibnaleem/gosearch@latest
language: Go
tags: [leak-data]
notes: >-
  Written in Go, so it needs a Go toolchain to install. It is one of the few breach tools that also enumerates social accounts, and it has a --no-false-positives flag worth using when the handle is
  a common word. An optional API key (-b) widens the breach checks. Breached records are personal data: in most countries you need a lawful basis to search them, the vendor logs every query against
  your account, and these sets are often stale, merged between people or planted.
