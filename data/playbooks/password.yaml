title: Handle a password you have found
summary: Record a found credential safely, check whether the password appears in known breaches, and read that result honestly.
starts_with: password
for: Credentials in a leak dump, a case file, a paste or an incident report, where exposure is the question.
time: 10–30 minutes
steps:
  - title: Record it without writing it down
    why: A case file is shared, copied and retained, so a plaintext credential in it becomes a lasting liability and can be misused by whoever reads it next.
    do: Give the password a reference label and store that instead of the password itself. Keep the plaintext in a sealed, access-controlled location if you must keep it at all, note where it came from and when, and record its length and character classes rather than its characters.
    look_for:
      - Where the credential came from and whether keeping it is justified at all
      - A length and pattern you can describe without reproducing it
    tools: []
    opsec: Never test a found password against an account you do not own, and never reuse it anywhere. That is credential misuse and a crime in most countries.

  - title: Check whether the password is in known breach data
    input: hash
    why: A breach corpus tells you whether this exact string has been leaked before, which is useful for judging exposure, and it can be checked without handing over the password.
    do: Use k-anonymity lookup so only the first five characters of the password's SHA-1 hash leave your machine, and note the result count. If you only hold a hash of the password, look that up instead.
    look_for:
      - A count, which shows how widely the string has circulated
      - No result, which is not a clean bill of health, only that this string is not in the dataset
    tools: [pwned-passwords, crackstation, weakpass]
    opsec: "Breached records are personal data: in most countries you need a lawful basis to search them, and these sets are often stale, merged between people or planted."

  - title: Read the result for what it is
    why: A leaked password and a compromised account are different findings, and the gap between them is where most mistakes happen.
    do: Write down what the match does and does not mean. A match means the string has appeared in at least one breach and that it is weak enough to have been recovered before; it says nothing about whose account used it today, or whether it was ever valid anywhere.
    look_for:
      - The string appearing in a top-wordlist, which says it is common rather than personal
      - A near-match to a name, date or company, which suggests a guessable scheme
      - Reuse across several accounts, which is a finding about hygiene, not about access
    tools: [seclists, weakpass]

  - title: Check exposure in the places that own the data
    why: The safest check is the one run inside the service that already holds your logins, because it never leaves that service.
    do: Use the breach and health reports of a password manager or browser that only examine the accounts it manages. Record the breach names and dates.
    look_for:
      - A breach name and date you can cite
      - A reused or weak flag inside the same report
    tools: [1password-watchtower, google-password-checkup, firefox-breach-alerts, bitwarden-reports]

  - title: Report the finding without the credential
    why: The point of the check is to advise, not to circulate the password further.
    do: In the case file, keep the reference label, the exposure result, the date you checked and what should happen next. Recommend a reset on the affected account by its owner, and keep the plaintext out of the report and out of any message you send.
    look_for:
      - Any copy of the credential left in notes, screenshots or chat logs
      - Whether the affected party needs to be told
    tools: []
